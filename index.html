<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827, #1f2937);
      color: #f8fafc;
    }

    .calculator {
      width: min(92vw, 360px);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .display {
      width: 100%;
      min-height: 90px;
      border: none;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      font-size: 2rem;
      text-align: right;
      padding: 18px 16px;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 18px 0;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    button:active {
      transform: translateY(1px);
    }

    .operator,
    .action {
      background: #f59e0b;
      color: #111827;
    }

    .number {
      background: #1e293b;
      color: #f8fafc;
    }

    .equal {
      background: #22c55e;
      color: #042f2e;
      grid-column: span 2;
    }

    .clear {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" readonly value="0" />

    <div class="buttons">
      <button class="action clear" type="button">C</button>
      <button class="action" type="button">DEL</button>
      <button class="operator" type="button">%</button>
      <button class="operator" type="button">/</button>

      <button class="number" type="button">7</button>
      <button class="number" type="button">8</button>
      <button class="number" type="button">9</button>
      <button class="operator" type="button">*</button>

      <button class="number" type="button">4</button>
      <button class="number" type="button">5</button>
      <button class="number" type="button">6</button>
      <button class="operator" type="button">-</button>

      <button class="number" type="button">1</button>
      <button class="number" type="button">2</button>
      <button class="number" type="button">3</button>
      <button class="operator" type="button">+</button>

      <button class="number" type="button">0</button>
      <button class="number" type="button">.</button>
      <button class="equal" type="button">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentValue = '0';
    let previousValue = '';
    let operator = '';
    let shouldResetDisplay = false;

    function updateDisplay() {
      display.value = currentValue;
    }

    function appendNumber(value) {
      if (currentValue === '0' || shouldResetDisplay) {
        currentValue = value;
        shouldResetDisplay = false;
      } else {
        currentValue += value;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (shouldResetDisplay) {
        currentValue = '0.';
        shouldResetDisplay = false;
        updateDisplay();
        return;
      }

      if (!currentValue.includes('.')) {
        currentValue += '.';
        updateDisplay();
      }
    }

    function chooseOperator(value) {
      if (operator && !shouldResetDisplay) {
        calculate();
      }

      previousValue = currentValue;
      operator = value;
      shouldResetDisplay = true;
    }

    function calculate() {
      if (!operator || previousValue === '') return;

      const a = Number(previousValue);
      const b = Number(currentValue);
      let result = 0;

      switch (operator) {
        case '+':
          result = a + b;
          break;
        case '-':
          result = a - b;
          break;
        case '*':
          result = a * b;
          break;
        case '/':
          result = b === 0 ? 'Error' : a / b;
          break;
        case '%':
          result = (a * b) / 100;
          break;
        default:
          return;
      }

      currentValue = String(result);
      operator = '';
      previousValue = '';
      shouldResetDisplay = true;
      updateDisplay();
    }

    function clearDisplay() {
      currentValue = '0';
      previousValue = '';
      operator = '';
      shouldResetDisplay = false;
      updateDisplay();
    }

    function deleteLast() {
      if (currentValue.length <= 1 || currentValue === 'Error') {
        currentValue = '0';
      } else {
        currentValue = currentValue.slice(0, -1);
      }
      updateDisplay();
    }

    document.querySelectorAll('.number').forEach((button) => {
      button.addEventListener('click', () => {
        const value = button.textContent;
        if (value === '.') appendDecimal();
        else appendNumber(value);
      });
    });

    document.querySelectorAll('.operator').forEach((button) => {
      button.addEventListener('click', () => chooseOperator(button.textContent));
    });

    document.querySelector('.equal').addEventListener('click', calculate);
    document.querySelector('.clear').addEventListener('click', clearDisplay);
    document.querySelector('.action:not(.clear)').addEventListener('click', deleteLast);
  </script>
</body>
</html>
